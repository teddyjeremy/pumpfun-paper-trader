name: Historical paper replay (checkpointed)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-backtest.yml"
      - "scripts/backtest-helius-day.ts"
      - "src/ingestion/helius-parsed-launch-discovery.ts"
      - "src/ingestion/helius-launch-window.ts"
      - "src/ingestion/pump-events.ts"
      - "scripts/backtest-helius-batch.ts"
      - "tests/helius-launch-window.test.ts"
  workflow_dispatch:
    inputs:
      date:
        description: "Nairobi calendar date to replay (YYYY-MM-DD)"
        required: true
        default: "2026-11-12"
        type: string
      previous_run_id:
        description: "Previous run ID containing pump-backtest-state for this date"
        required: false
        default: "43505595998"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-paper-replay-shared-helius-key
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      BACKTEST_DATE: ${{ github.event.inputs.date || '2026-11-12' }}
      PREVIOUS_RUN_ID: ${{ github.event.inputs.previous_run_id || '43503737277' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Restore previous checkpoint
        if: env.PREVIOUS_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: pump-backtest-state-${{ github.event.inputs.date || '2026-11-12' }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.PREVIOUS_RUN_ID }}

      - name: Validate Helius secret
        run: |
          test -n "$HELIUS_API_KEY" || { echo "HELIUS_API_KEY repository secret is missing"; exit 1; }

      - name: Validate Neon dashboard publishing secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL GitHub Actions secret is required to publish results to the dashboard; stopping before Helius credits are spent."; exit 1; }

      - name: Discover the bounded time-stratified launch sample (first run only)
        run: |
          DISCOVERY="artifacts/pump-launch-discovery-$BACKTEST_DATE.json"
          if [ ! -f "$DISCOVERY" ] || ! node -e 'const d=require("./"+process.argv[1]); process.exit(d.provider === "HELIUS_PARSED_EVENTS_SCAN" && d.status === "SAMPLE_COMPLETE" ? 0 : 1)' "$DISCOVERY"; then
            npm run backtest:discover -- --date="$BACKTEST_DATE" --utc-offset-minutes=180 --max-credits=15000 --max-launches=100 --max-pages-per-bucket=20
          else
            echo "Restored complete discovery artifact; skipping discovery."
          fi

      - name: Screen launches using one signature page each (resumable)
        run: npm run backtest:screen -- --date="$BACKTEST_DATE" --max-credits=500 --max-share-pct=30 --min-successful=5 --min-active-buckets=3

      - name: Replay all selected launches in resumable batches of 20
        run: |
          FIRST_BATCH=true
          while true; do
            RETRY_FLAG="--retry-incomplete=false"
            if [ "$FIRST_BATCH" = true ]; then
              RETRY_FLAG="--retry-incomplete=true"
              FIRST_BATCH=false
            fi
            npm run backtest:batch -- --date="$BACKTEST_DATE" --batch-size=20 --max-credits=50000 "$RETRY_FLAG"
            STATUS=$(node -e 'const s=require("./artifacts/batch-summary-"+process.env.BACKTEST_DATE+".json"); process.stdout.write(String(s.status))')
            if [ "$STATUS" != "BATCH_COMPLETE" ]; then
              break
            fi
          done

      - name: Rank decoded coins by actual first-30-second trades
        if: always() && hashFiles('artifacts/coins/*.json') != ''
        run: |
          if [ -d artifacts/coins ]; then
            npm run backtest:rank -- --date="$BACKTEST_DATE" --min-buyers=15 --min-buy-trades=15 --min-move-pct=10 --min-liquidity-sol=5
          else
            echo "No deep-replay coin files yet; skipping ranking."
          fi

      - name: Publish historical research to Neon dashboard
        if: always() && hashFiles('artifacts/pump-launch-discovery-*.json') != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run backtest:publish -- --date="$BACKTEST_DATE" --run-id="$GITHUB_RUN_ID"

      - name: Save checkpoint and collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pump-backtest-state-${{ github.event.inputs.date || '2026-11-12' }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
