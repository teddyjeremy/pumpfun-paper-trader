name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paper
          POSTGRES_PASSWORD: paper
          POSTGRES_DB: paper_trader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paper -d paper_trader_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAPER_TEST_DATABASE_URL: postgres://paper:paper@localhost:5432/paper_trader_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler/deploy --config infra/cloudflare/worker/wrangler.jsonc
