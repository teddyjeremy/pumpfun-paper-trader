name: Finalize paused paper session after quota reset

on:
  schedule:
    - cron: "5 0 15 11 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Persist disabled session state after daily quota reset
        env:
          PAPER_WORKER_CONTROL_TOKEN: ${{ secrets.PAPER_WORKER_CONTROL_TOKEN }}
          PAPER_WORKER_URL: https://pumpfun-paper-worker.teddyjeremy12.workers.dev
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --max-time 20 \
            -X POST "$PAPER_WORKER_URL/finalize-stop" \
            -H "Authorization: Bearer $PAPER_WORKER_CONTROL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')"
          echo "$response" | node -e '
            let s=""; process.stdin.on("data", c => s+=c).on("end", () => {
              const status=JSON.parse(s);
              if (status.enabled !== false || status.connected !== false || status.heliusConnected !== false) {
                console.error("The previous paper session is not fully finalized.");
                process.exit(1);
              }
              if (status.lastError) {
                console.error(String(status.lastError));
                process.exit(1);
              }
              console.log("PASS: previous paper session is durably stopped; Worker remains paused.");
            });
          '
