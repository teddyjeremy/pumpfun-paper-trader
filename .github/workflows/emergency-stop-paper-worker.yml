name: Emergency stop paused paper worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-stop-paper-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emergency-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Close provider streams without relying on Durable Object writes
        env:
          PAPER_WORKER_CONTROL_TOKEN: ${{ secrets.PAPER_WORKER_CONTROL_TOKEN }}
          PAPER_WORKER_URL: https://pumpfun-paper-worker.teddyjeremy12.workers.dev
        run: |
          set -euo pipefail
          sleep 15
          response="$(curl --silent --show-error --fail-with-body \
            --max-time 15 \
            -X POST "$PAPER_WORKER_URL/stop" \
            -H "Authorization: Bearer $PAPER_WORKER_CONTROL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')"
          echo "$response" | node -e '
            let s=""; process.stdin.on("data", c => s+=c).on("end", () => {
              const status=JSON.parse(s);
              if (status.enabled !== false || status.connected !== false || status.heliusConnected !== false) {
                console.error("Emergency stop did not close both provider streams.");
                process.exit(1);
              }
              console.log("Provider streams closed in memory.");
              if (String(status.lastError || "").includes("could not persist disabled state")) {
                console.log("Durable Object storage remains quota-blocked; static pause remains enforced.");
              }
            });
          '
