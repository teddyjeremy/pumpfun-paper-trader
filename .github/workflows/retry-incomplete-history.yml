# The two date-scoped jobs share a hard 8,000-credit incremental ceiling each.
name: Retry incomplete historical coins (bounded, no rediscovery)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retry-incomplete-history.yml"
  workflow_dispatch:

concurrency:
  group: historical-paper-replay-shared-helius-key
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  retry-incomplete:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck and test before spending Helius credits
        run: npm run typecheck:scripts && npm test -- --run

      - name: Restore Nov 11 reranked checkpoint
        uses: actions/download-artifact@v4
        with:
          name: pump-backtest-state-2026-11-11-retried
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43572311606
      - name: Retry Nov 11 cap-limited coins only
        run: |
          npm run backtest:batch -- --date=2026-11-11 --batch-size=20 --max-credits=30000 --max-new-credits=8000 --max-signatures=2500 --retry-incomplete=true --skip-mints=DJYzweGzY3xTCAdTug9L4tVPGFVUjpZ7wXrstw2DJNjk,65gZLLzUkycqaoByzNSU7Yf9FPZjBfHFf9eZPr1kpump,9fnyD1gbaAfEedzfe64PC1R8xnRw6ud41A9UdjGgpump
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      - name: Retry remaining Nov 11 candidates within the same 8,000-credit cap
        run: |
          used="$(node -e 'const c=require("./artifacts/checkpoint.json"); process.stdout.write(String(c.cumulativeCreditsUsed))')"
          remaining=$((8000 - (used - 3795)))
          if [ "$remaining" -gt 0 ]; then
            npm run backtest:batch -- --date=2026-11-11 --batch-size=20 --max-credits=30000 --max-new-credits="$remaining" --max-signatures=2500 --retry-incomplete=false --skip-mints=DJYzweGzY3xTCAdTug9L4tVPGFVUjpZ7wXrstw2DJNjk,65gZLLzUkycqaoByzNSU7Yf9FPZjBfHFf9eZPr1kpump,9fnyD1gbaAfEedzfe64PC1R8xnRw6ud41A9UdjGgpump
          else
            echo "Nov 11 retry budget exhausted; no second batch."
          fi
      - name: Rerank Nov 11
        run: npm run backtest:rank -- --date=2026-11-11 --min-buyers=15 --min-buy-trades=15 --min-move-pct=10 --min-liquidity-sol=5
      - name: Publish Nov 11 to Neon
        run: npm run backtest:publish -- --date=2026-11-11 --run-id="$GITHUB_RUN_ID"
      - name: Save Nov 11 retried dataset
        uses: actions/upload-artifact@v4
        with:
          name: pump-backtest-state-2026-11-11-retried
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Clear workspace before Nov 12
        run: rm -rf artifacts
      - name: Restore Nov 12 reranked checkpoint
        uses: actions/download-artifact@v4
        with:
          name: pump-backtest-state-2026-11-12-retried
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43572311606
      - name: Retry Nov 12 cap-limited coins only
        run: |
          npm run backtest:batch -- --date=2026-11-12 --batch-size=20 --max-credits=50000 --max-new-credits=8000 --max-signatures=2500 --retry-incomplete=true --skip-mints=J2CD5wvQ1V5GCbeYHBf68vTauYiVSYwBpUZwbWZXZQvN,4s1jvCiFeoXDYGBjZR5PSJGbxMH6piDvEgoo5hECpump,F66tmpu8QmR5BifVWfgbrfgwLtd1DPgYaWhhyZU6pump
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      - name: Retry remaining Nov 12 candidates within the same 8,000-credit cap
        run: |
          used="$(node -e 'const c=require("./artifacts/checkpoint.json"); process.stdout.write(String(c.cumulativeCreditsUsed))')"
          remaining=$((8000 - (used - 22951)))
          if [ "$remaining" -gt 0 ]; then
            npm run backtest:batch -- --date=2026-11-12 --batch-size=20 --max-credits=50000 --max-new-credits="$remaining" --max-signatures=2500 --retry-incomplete=false --skip-mints=J2CD5wvQ1V5GCbeYHBf68vTauYiVSYwBpUZwbWZXZQvN,4s1jvCiFeoXDYGBjZR5PSJGbxMH6piDvEgoo5hECpump,F66tmpu8QmR5BifVWfgbrfgwLtd1DPgYaWhhyZU6pump
          else
            echo "Nov 12 retry budget exhausted; no second batch."
          fi
      - name: Rerank Nov 12
        run: npm run backtest:rank -- --date=2026-11-12 --min-buyers=15 --min-buy-trades=15 --min-move-pct=10 --min-liquidity-sol=5
      - name: Publish Nov 12 to Neon
        run: npm run backtest:publish -- --date=2026-11-12 --run-id="$GITHUB_RUN_ID"
      - name: Save Nov 12 retried dataset
        uses: actions/upload-artifact@v4
        with:
          name: pump-backtest-state-2026-11-12-retried
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
