name: Production Worker-to-Neon smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-ingestion.yml"
      - "infra/cloudflare/worker/src/**"
      - "src/server.ts"
      - "src/persistence/**"
      - "db/migrations/**"
      - "scripts/verify-worker-ingestion.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-worker-neon-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application dependencies
        run: npm install
      - name: Detect intentional Durable Objects quota pause
        id: pause
        run: |
          if grep -q '"PAPER_WORKER_PAUSED": "true"' infra/cloudflare/worker/wrangler.jsonc; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify production Worker, API and Neon persistence
        if: steps.pause.outputs.paused != 'true'
        run: npm run smoke:ingestion
        env:
          PAPER_WORKER_CONTROL_TOKEN: ${{ secrets.PAPER_WORKER_CONTROL_TOKEN }}
      - name: Verify static quota-protection health
        if: steps.pause.outputs.paused == 'true'
        run: node scripts/verify-worker-paused.mjs
      - name: Report intentional pause
        if: steps.pause.outputs.paused == 'true'
        run: |
          echo "Worker is intentionally paused. No Durable Object storage writes or market-stream work are permitted until quota reset and batching remediation." >> "$GITHUB_STEP_SUMMARY"
