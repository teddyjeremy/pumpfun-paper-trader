name: Verify forward paper observation session
# Re-run after bounded queue drains and 120-second PostgreSQL lease renewal.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-forward-observation.yml"

permissions:
  contents: read

jobs:
  verify-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: https://pumpfun-paper-worker.teddyjeremy12.workers.dev
      CONTROL_TOKEN: ${{ secrets.PAPER_WORKER_CONTROL_TOKEN }}
    steps:
      - name: Verify paper mode, live streams, lease, and closed entry gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONTROL_TOKEN" || { echo "PAPER_WORKER_CONTROL_TOKEN is missing"; exit 1; }
          STATUS=$(curl --fail --silent --show-error -H "Authorization: Bearer $CONTROL_TOKEN" "$WORKER_URL/status")
          printf '%s' "$STATUS" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const s = JSON.parse(raw);
              const blockers = Array.isArray(s.readinessBlockers) ? s.readinessBlockers : [];
              const calibrationBlocked = blockers.some(x => String(x).includes("Reviewed chronological volume calibration is not configured"));
              const leaseBlocked = blockers.some(x => String(x).includes("Fenced PostgreSQL Worker lease is not held"));
              const checks = {
                paperMode: s.mode === "paper",
                sessionEnabled: s.enabled === true,
                discoveryConnected: s.connected === true,
                discoverySubscribed: s.subscriptionsSent === true,
                heliusConnected: s.heliusConnected === true,
                persistenceLeaseHeld: !leaseBlocked,
                simulatedEntriesLocked: s.tradingReady === false && calibrationBlocked
              };
              process.stdout.write(JSON.stringify({
                checks,
                blockers,
                lastError: typeof s.lastError === "string" ? s.lastError.slice(0, 240) : null,
                reconnectAttempts: s.reconnectAttempts,
                nextReconnectAt: s.nextReconnectAt,
                connectedAt: s.connectedAt,
                lastMessageAt: s.lastMessageAt
              }));
              if (Object.values(checks).some(value => value !== true)) {
                console.error("Forward observation session is not fully connected or its entry gate is not closed.");
                process.exit(1);
              }
            });
          '
