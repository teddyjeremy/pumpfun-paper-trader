name: Resume Nov 13 historical replay and profitability

on:
  push:
    paths:
      - ".github/workflows/resume-historical-backtest-2026-11-13.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-paper-replay-shared-helius-key
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKTEST_DATE: "2026-11-13"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Validate credentials before resuming
        run: |
          test -n "$HELIUS_API_KEY" || { echo "HELIUS_API_KEY is required"; exit 1; }
          test -n "$DATABASE_URL" || { echo "DATABASE_URL is required to publish results"; exit 1; }

      - name: Restore the Nov 13 checkpoint and collected coin files
        uses: actions/download-artifact@v4
        with:
          name: pump-backtest-state-2026-11-13-expanded
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43574027915
          path: artifacts

      - name: Resume remaining launches and retry incomplete mints within the original 50k credit ceiling
        run: |
          FIRST_BATCH=true
          while true; do
            RETRY_FLAG="--retry-incomplete=false"
            if [ "$FIRST_BATCH" = true ]; then
              RETRY_FLAG="--retry-incomplete=true"
              FIRST_BATCH=false
            fi
            npm run backtest:batch -- --date="$BACKTEST_DATE" --batch-size=20 --max-credits=50000 --max-new-credits=44740 --max-signatures=5000 "$RETRY_FLAG"
            STATUS="$(node -e 'const s=require("./artifacts/batch-summary-"+process.env.BACKTEST_DATE+".json"); process.stdout.write(String(s.status))')"
            if [ "$STATUS" != "BATCH_COMPLETE" ]; then
              echo "Replay stopped at checkpoint status: $STATUS"
              break
            fi
          done

      - name: Rank all completed coins by verified first-30-second activity
        if: always() && hashFiles('artifacts/coins/*.json') != ''
        run: npm run backtest:rank -- --date="$BACKTEST_DATE" --min-buyers=15 --min-buy-trades=15 --min-move-pct=10 --min-liquidity-sol=5

      - name: Run strict strategy profitability audit and price-path research
        if: always() && hashFiles('artifacts/coins/*.json') != ''
        run: npm run backtest:profitability -- --date="$BACKTEST_DATE" --round-trip-cost-pct=4

      - name: Publish completed research dataset to Neon
        if: always() && hashFiles('artifacts/pump-launch-discovery-*.json') != ''
        run: npm run backtest:publish -- --date="$BACKTEST_DATE" --run-id="$GITHUB_RUN_ID"

      - name: Save resumed historical dataset and profitability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pump-backtest-state-and-profitability-2026-11-13-resumed
          path: |
            artifacts/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
