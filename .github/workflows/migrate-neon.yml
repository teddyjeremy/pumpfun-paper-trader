name: Apply Neon database migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Set to yes only when you intend to apply pending schema migrations to Neon"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: neon-schema-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check database secret is configured
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add DATABASE_URL under Repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Apply ordered migrations
        run: npm run db:migrate
